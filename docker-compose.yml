version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: domus-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: domus_flow
      POSTGRES_USER: domus_flow
      POSTGRES_PASSWORD: domus_flow_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U domus_flow -d domus_flow']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: domus-flow-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: domus_flow_test
      POSTGRES_USER: domus_flow
      POSTGRES_PASSWORD: domus_flow_dev
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U domus_flow -d domus_flow_test']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: domus-flow-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
    name: domus_flow_postgres_data
  postgres_test_data:
    name: domus_flow_postgres_test_data
