name: Deploy to GitHub Pages (Demo Mode)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-demo:
    name: Build Frontend Demo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build frontend in Demo Mode
        run: npm run build:demo
        env:
          VITE_DEMO_MODE: 'true'
          VITE_APP_NAME: 'DomusFlow'
          VITE_APP_VERSION: ${{ github.sha }}
          # Base path for GitHub Pages subdirectory deployment
          VITE_BASE_PATH: '/domus-flow/'

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-demo
          path: apps/frontend/dist/
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-demo
    environment:
      name: github-pages
      url: https://FranekJemiolo.github.io/domus-flow/

    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages-demo
          path: dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: ''
          commit_message: 'Deploy DomusFlow Demo - ${{ github.sha }}'
